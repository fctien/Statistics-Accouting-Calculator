<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BACalc 財務計算機</title>
  <meta name="description" content="仿 TI BA II Plus Professional 的財務／會計計算機（可離線 PWA）">
  <meta name="theme-color" content="#1565c0">
  <!-- 全部使用相對網址（relative URL）：部署在 GitHub Pages 子路徑下 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- View：殼（app shell）。導覽由 js/views/nav.js 產生，工作表由 js/views/form.js 產生 -->
  <a class="skip-link" href="#sheet-title">跳到工作表</a>
  <header class="app-header">
    <h1 class="app-title">BACalc 財務計算機</h1>
    <label class="quick-dec" for="quick-decimals" title="結果顯示的小數位數（與「設定」同步）">小數
      <select id="quick-decimals" class="control"></select></label>
    <span id="py-status" class="pill pill-loading" role="status"
          aria-live="polite" title="Python 引擎載入中">載入中</span>
  </header>
  <div class="layout">
    <nav id="side-nav" class="side-nav" aria-label="全部工作表"></nav>
    <main id="app">
      <h2 id="sheet-title" class="sheet-title" tabindex="-1"></h2>
      <p id="sheet-intro" class="sheet-intro"></p>
      <div id="sheet"></div>
    </main>
  </div>
  <nav id="tab-bar" class="tab-bar" aria-label="主要工作表"></nav>
  <noscript><p class="noscript">本程式需要啟用 JavaScript。</p></noscript>
</body>
</html>
